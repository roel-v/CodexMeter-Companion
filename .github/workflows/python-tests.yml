name: Python Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the Desktop wrapper
        if: runner.os == 'Windows'
        working-directory: tools/desktop-wrapper
        shell: pwsh
        run: |
          $env:TEMP = 'D:\codexmeter-wrapper-tmp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        env:
          # The Windows hardware fixtures require disposable registry copies on D:.
          PYTEST_ADDOPTS: ${{ runner.os == 'Windows' && '--basetemp=D:/codexmeter-pytest' || '' }}
        run: python -m pytest -q -W error::pytest.PytestUnraisableExceptionWarning
